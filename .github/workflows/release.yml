name: Release - Stable OpenWrt

on:
  workflow_run:
    workflows: [Stable OpenWrt Build - AX3000T-AN8855]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful default-branch stable build run ID (retry publication only)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified stable firmware
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Checkout trusted release implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate stable build origin and actual build job
        id: candidate
        run: python3 scripts/ci-build-state.py release-gate --run-id "$BUILD_RUN_ID"

      - name: Download only this successful build attempt
        if: steps.candidate.outputs.eligible == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/stable-release-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.candidate.outputs.run_id }}

      - name: Verify, stage and publish the upstream-named Release
        if: steps.candidate.outputs.eligible == 'true'
        run: >-
          python3 scripts/publish-stable-release.py --run-id "$BUILD_RUN_ID"
          --artifacts "$RUNNER_TEMP/stable-release-input"
          --staging "$RUNNER_TEMP/stable-release-staged"
