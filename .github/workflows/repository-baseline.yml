name: Repository Baseline

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Keep standalone checks separate from checks reused by the PR workflow.
  group: repository-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Deliberate: stable major tag + Dependabot, no SHA pin (read-only baseline, no secrets).
        uses: actions/checkout@v7
      - name: Run repository baseline check
        run: ./scripts/repository-check
      - name: Check first-boot configuration preservation
        run: bash scripts/tests/test-firstboot-defaults.sh
      - name: Check board script backup safety
        run: bash scripts/tests/test-board-script-backups.sh
