name: Repository Baseline

on:
  workflow_dispatch: {}
  workflow_call:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Keep standalone checks separate from checks reused by the PR workflow.
  group: repository-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-legacy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware-stable-latest-7ec9b23a8df16603c7cf35dcdddb36014d5d97f9
          run-id: 41290332504
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: legacy
      - name: Inspect verified legacy version evidence
        run: |
          cd legacy
          sha256sum --check SHA256SUMS.txt >/dev/null
          printf '[DEBUG-legacy-evidence] files\n'
          ls -1
          printf '[DEBUG-legacy-evidence] source\n'
          cat BUILD-INFO.txt
          printf '[DEBUG-legacy-evidence] configuration\n'
          grep -E 'CONFIG_VERSION|CONFIG_TARGET_mediatek_filogic_DEVICE' full.config recovery.config

  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Deliberate: stable major tag + Dependabot, no SHA pin (read-only baseline, no secrets).
        uses: actions/checkout@v7
      - name: Run repository baseline check
        run: ./scripts/repository-check
      - name: Check first-boot configuration preservation
        run: bash scripts/tests/test-firstboot-defaults.sh
      - name: Check board script backup safety
        run: bash scripts/tests/test-board-script-backups.sh
      - name: Check Nikki profiles and dual-image safety
        run: bash scripts/tests/test-nikki-build.sh
      - name: Check supported build entry points
        run: bash scripts/tests/test-build-entrypoints.sh
      - name: Check latest-main refresh and failure safety
        run: bash scripts/tests/test-upstream-main.sh
      - name: Check upstream polling and stable-only publication
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_release.py' -v
      - name: Check stable and mainline patch compatibility
        run: bash scripts/tests/test-patch-compatibility.sh
      - name: Check AN8855 target and NFC prerequisites
        run: bash scripts/tests/test-an8855.sh
      - name: Check Argon defaults and retained theme choices
        run: bash scripts/tests/test-argon.sh
      - name: Check imported xinfc payload and offline package hooks
        run: bash scripts/tests/test-xinfc.sh
      - name: Check wireless NFC apply lifecycle and permissions
        run: node scripts/tests/test-wireless-nfc.js
